appId: se.lukaslindqvist.runbro.e2e
tags:
  - session
---
# A fixed point, set before the run opens the fix stream: the location task keeps delivering
# fixes for it (distanceInterval: 0), so this stationary run records real points that never
# leave one spot — zero route extent. The only automated cover for the route-extent gate
# (domain/geo.ts's MIN_ROUTE_EXTENT_M, read in use-run-route.ts): a reverted predicate there
# would render a map with a single dot instead of the fallback card.
- runFlow: ../helpers/launch-and-onboard.yaml
- setLocation:
    latitude: 59.3293
    longitude: 18.0686
- runFlow: ../helpers/start-w1d1.yaml
- extendedWaitUntil:
    visible:
      text: "Nice work.*"
    timeout: 120000
# The route card sits above the stat grid, reachable without scrolling. The heading is common
# to both no-route reasons (no fixes at all vs. fixes with no extent) — asserted generically,
# since which copy renders is a separate, open question (see AGENTS.md's e2e notes).
- assertVisible: "No route for this run"
- assertNotVisible: "Map of your .* route.*"
# Every session is bracketed by a warm-up — the finished run's segment key names
# it in the summary's colour legend. Asserted here, on the settled summary, not
# on the run screen: the compressed warm-up is ~5 s and races Maestro's poll
# across the modal transition, so a run-screen "Warm Up" check is inherently
# flaky. scrollUntilVisible (not a bare assertVisible) so the legend — the last
# card, below the stat grid — is reached even if it sits below the fold.
# "Warm Up" is Title Case (SEGMENT_KIND_LABEL, renamed in the HIG-audit PR).
- scrollUntilVisible:
    element:
      text: "Warm Up"
# Granted but stationary → zero distance: the derived tiles and the splits card stay out.
- assertNotVisible: "Distance"
- assertNotVisible: "Interval Pace"
- tapOn: "Close"
- tapOn: "Log"
- scrollUntilVisible:
    element:
      text: "Week 1 · Day 1"
- tapOn: "Plan"
# The next-session marker is an icon-only arrow — no text to target (ADR 0016).
- assertVisible:
    id: "plan-next-w1d2"
