name: E2E

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  precheck:
    # Decide whether the change is app-affecting (run E2E) or provably docs-only
    # (skip). Always runs, and is a REQUIRED check — so a failure here blocks the
    # PR and can't let e2e-ios or e2e-android skip-to-success without testing.
    # A job skipped by `if:` (docs-only) reports success and satisfies its
    # required check.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Decide whether app-affecting files changed
        id: decide
        run: bun .github/scripts/decide-run.ts

  e2e-ios:
    needs: precheck
    if: needs.precheck.outputs.run == 'true'
    # macos-26 (default Xcode 26.x) — Expo SDK 57 / RN 0.86 require Xcode 26;
    # macos-15 tops out at Xcode 16.4 and fails building the ExpoModulesJSI
    # xcframework. Still a standard runner → free/unlimited on public repos.
    runs-on: macos-26
    env:
      APP_VARIANT: e2e
    # 75: a fingerprint change forces a cache miss, and the slow path (~15-20 min
    # `eas build --local` + boot + install + the full Maestro suite) then recurs on
    # the first main-branch run after a squash-merge too, since actions/cache writes
    # are branch-scoped.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Set up Java (Maestro requires a JDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies (frozen)
        run: bun ci

      - name: Build or repack the E2E app
        id: app
        uses: ./.github/actions/e2e-native-app
        with:
          platform: ios
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: Boot simulator and install app
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | last | .udid')
          echo "Simulator UDID: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "${{ steps.app.outputs.app-path }}"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Enable Reduce Motion (so Maestro can settle on the animated run screen)
        run: |
          # The run screen animates continuously (Skia countdown + Reanimated
          # progress bar), so Maestro's screenshot-based "wait for animation to
          # end" never settles — each interaction stalls ~40s, long enough for the
          # seconds-long compressed session to finish underneath the run-controls
          # flow. Reduce Motion collapses both animations to instant (the app
          # honours it by default: Reanimated withTiming and number-flow both
          # respect the system setting), so the screen settles and Maestro
          # interacts reliably. Maestro's own disableAnimations flag is cloud-only,
          # so set it on the simulator directly. Maestro cold-launches the app for
          # each flow, so it is read at launch.
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" defaults write com.apple.Accessibility ReduceMotionEnabled -int 1

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro suite
        run: maestro --device "${{ steps.sim.outputs.udid }}" test .maestro/

      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-output
          path: ~/.maestro/tests/**
          if-no-files-found: ignore

  e2e-android:
    # Same shape as e2e-ios (ADR 0025 stage 7): the shared build-or-repack
    # action, then the flows not tagged ios-only on a KVM emulator.
    needs: precheck
    if: needs.precheck.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: e2e
      # why: the emulator is x86_64; building one ABI instead of four cuts the Gradle time.
      ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Set up Java (Gradle and Maestro require a JDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # why: setup-java's `cache: gradle` hashes build files under the gitignored android/,
      # so it would never hit; this caches ~/.gradle for the cache-miss build.
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies (frozen)
        run: bun ci

      - name: Build or repack the E2E app
        id: app
        uses: ./.github/actions/e2e-native-app
        with:
          platform: android
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install app, run Maestro suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # The Android counterpart of e2e-ios's Reduce Motion step: zeroed
          # animator scales collapse the run screen's animations so Maestro settles.
          disable-animations: true
          # Each line runs in its own shell, so nothing here can depend on the one before.
          script: |
            adb install -r "${{ steps.app.outputs.app-path }}"
            maestro test --exclude-tags ios-only .maestro/

      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-output-android
          path: ~/.maestro/tests/**
          if-no-files-found: ignore
