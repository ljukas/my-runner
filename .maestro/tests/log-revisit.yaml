appId: se.lukaslindqvist.runbro.e2e
tags:
  - session
---
- runFlow: ../helpers/start-first-session.yaml
# Finish the (compressed) session.
- extendedWaitUntil:
    visible:
      text: "Nice work.*"
    timeout: 120000
- tapOn: "Close"
# Revisit from the Log tab.
- tapOn: "Log"
- tapOn:
    text: "Week 1 · Day 1"
# The revisit header is neutral — the celebratory line must be absent.
- assertVisible:
    text: "Week 1 · Day 1"
# "Active Time" stands in for "the summary is open": it is a stat-tile header
# that survives a run with no GPS, and the two-word string avoids the collisions
# a bare "running"/"active" hits (the tab bar's "Running" a11y label, other copy).
- assertNotVisible:
    text: "Nice work.*"
- assertVisible: "Active Time"
# Dismiss with the summary's native gesture rather than its "Close" toolbar
# button (tapped everywhere else) — the swipe is now one of only two ways out, so
# it needs its own cover. Presented modally (presentation: 'modal' in _layout —
# an iOS page sheet), so the dismissal is a swipe *down*, not a left-edge
# back-swipe (a card gesture the sheet ignores). Start the drag on the
# large-title bar, above the scroll content, so it pulls the sheet down instead
# of scrolling it.
- swipe:
    start: "50%, 12%"
    end: "50%, 92%"
    duration: 600
- assertNotVisible: "Active Time"
- assertVisible:
    text: "Week 1 · Day 1"
