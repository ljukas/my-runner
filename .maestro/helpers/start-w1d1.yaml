appId: se.lukaslindqvist.runbro.e2e
---
# The Run tab's chooser → w1d1 running. Onboarding is already done and the caller has stubbed the
# location answer on its own launchApp. The button stays disabled until the launch-time resume check
# settles: iOS reports that, but on Android the text node Maestro sees does not carry the button's
# disabled state, so the tap is retried as well.
- extendedWaitUntil:
    visible:
      text: "Up next: Week 1 · Day 1"
      enabled: true
    timeout: 15000
- retry:
    maxRetries: 3
    commands:
      - tapOn: "Up next: Week 1 · Day 1"
      - assertVisible: "Week 1 · Day 1"
- tapOn: "Start Session"
