appId: se.lukaslindqvist.runbro.e2e
---
# E2E build launches straight to the app (no dev launcher). Clear state for a fresh install
# and pre-grant location, so neither the primer's prompt nor the just-in-time ask at first
# run start can raise a system dialog the flow would hang on. Ends on the Run tab.
#
# why motion too: the barometer needs Motion & Fitness (ADR 0015), and iOS raises that dialog
# when the altimeter first starts — mid-run. A system alert is not app state, so `clearState`
# does NOT dismiss it: one flow triggering it strands every later flow behind it.
#
# Android has no `motion` key and takes allow/deny for location; the barometer capture's run-start
# ask is ACTIVITY_RECOGNITION, granted by its full permission id (ADR 0015's 2026-09-27 amendment).
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          clearState: true
          permissions:
            location: inuse
            motion: allow
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          clearState: true
          permissions:
            location: allow
            android.permission.ACTIVITY_RECOGNITION: allow
- runFlow: complete-onboarding.yaml
