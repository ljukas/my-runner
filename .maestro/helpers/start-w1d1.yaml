appId: se.lukaslindqvist.runbro.e2e
---
# Plan list → w1d1 running. Onboarding is already done and the caller has stubbed the
# location answer on its own launchApp.
# "Day 1" repeats in every week section — the first match is Week 1's.
- scrollUntilVisible:
    element:
      text: "Day 1"
      index: 0
- tapOn:
    text: "Day 1"
    index: 0
- assertVisible: "Week 1 · Day 1"
- tapOn: "Start Session"
