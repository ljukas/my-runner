appId: se.lukaslindqvist.runbro.e2e
---
# Steps 1-2 of the four versioned onboarding steps (welcome, audio-cues). Lands on the
# location primer with both of its CTAs untouched, so each caller picks the answer it needs.
#
# Retry the tap + its landing assertion together: the E2E build's larger binary
# (Skia/Reanimated) launches slowly, so a screen can be visible but not yet
# interactive when Maestro taps — the tap silently no-ops. Re-tapping until the
# next screen appears absorbs that transient miss instead of failing the flow.
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "Welcome to"
      - retry:
          maxRetries: 3
          commands:
            - tapOn: "Continue"
            - assertVisible: "Your pocket running coach" # audio-cues step heading
# Android's welcome is a three-page carousel (carousel spec §3): paged with Next, finished with
# Get started. Each page's headline is the landing assertion for the tap before it.
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "From couch to 5K"
      - retry:
          maxRetries: 3
          commands:
            - tapOn: "Next"
            - assertVisible: "Guided intervals"
      - retry:
          maxRetries: 3
          commands:
            - tapOn: "Next"
            - assertVisible: "Private and free"
      - retry:
          maxRetries: 3
          commands:
            - tapOn: "Get started"
            - assertVisible: "Your pocket running coach" # audio-cues step heading
- retry:
    maxRetries: 3
    commands:
      - tapOn: "Continue"
      # location-primer heading: iOS | Android (the platforms' copy differs by design, ADR 0025)
      - assertVisible: "(Track your route and your pace|Location for distance and cues)"
